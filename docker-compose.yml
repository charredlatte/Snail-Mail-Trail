# Production stack: Postgres + the API. Put nginx in front for TLS.
# See docs/DEPLOY.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: snailmail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: snailmail
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snailmail"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports section: the database is reachable only from the api container,
    # never from the internet. Use `docker compose exec db psql` to get a shell.

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://snailmail:${POSTGRES_PASSWORD}@db:5432/snailmail
      PORT: 3000
      HOST: 0.0.0.0
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      COOKIE_SECURE: "true"
    ports:
      - "127.0.0.1:3000:3000"   # localhost only; nginx terminates TLS

volumes:
  pgdata:
