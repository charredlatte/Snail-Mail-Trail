<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1230" viewBox="0 0 1440 1230">
  <title>Snail Mail Trail - Submit a club</title>
  <rect width="1440" height="1230" fill="#f4f4f3"/>
  <g id="header">
  <rect x="0" y="0" width="1440" height="68" rx="0" fill="#ffffff"/>
  <line x1="0" y1="68" x2="1440" y2="68" stroke="#d8d8d8" stroke-width="1"/>
  <circle cx="46" cy="34" r="11" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
  <path d="M40 34 a6 6 0 0 1 12 0 a3.2 3.2 0 0 1 -6.4 0" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <text x="68" y="39" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">Snail Mail Trail</text>
  <text x="1140" y="39" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Browse</text>
  <text x="1210" y="39" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Submit a club</text>
  <rect x="1316" y="18" width="84" height="32" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="1358.0" y="38.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">Sign in</text>
  </g>
  <g id="submit">
  <text x="40" y="128" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a">Submit a club</text>
  <text x="40" y="158" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6b6b6b">Know a club that is not listed? Add it here.</text>
  <rect x="40" y="186" width="880" height="62" rx="6" fill="#fdf6ec" stroke="#e8cfa8" stroke-width="1"/>
  <circle cx="74" cy="217" r="10" fill="none" stroke="#9a3412" stroke-width="1.5"/>
  <text x="74" y="222" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9a3412" text-anchor="middle">i</text>
  <text x="98" y="212" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#9a3412">Every submission is reviewed before it appears.</text>
  <text x="98" y="232" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a3412">Nothing goes live automatically. You will see it under &quot;My submissions&quot;.</text>
  <rect x="40" y="272" width="880" height="870" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="72" y="312" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b6b6b">CLUB NAME *</text>
  <rect x="72" y="320" width="816" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="84" y="344.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a8a8a8">Columbus Postcard Swap</text>
  <text x="72" y="388" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b6b6b">DESCRIPTION</text>
  <rect x="72" y="396" width="816" height="104" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="84" y="420" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a8a8a8">How it works, who it is for, how to join...</text>
  <text x="72" y="536" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b6b6b">WEBSITE OR SIGN-UP LINK</text>
  <rect x="72" y="544" width="816" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="84" y="568.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a8a8a8">https://</text>
  <text x="72" y="598" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="500" fill="#b4530a">Must be http(s). javascript: and data: links are rejected.</text>
  <line x1="72" y1="626" x2="888" y2="626" stroke="#d8d8d8" stroke-width="1"/>
  <text x="72" y="658" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Price</text>
  <text x="72" y="682" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b6b6b">AMOUNT</text>
  <rect x="72" y="690" width="240" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="84" y="714.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a8a8a8">5.00</text>
  <text x="336" y="682" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b6b6b">CURRENCY</text>
  <rect x="336" y="690" width="200" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="348" y="714.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a1a1a">USD</text>
  <path d="M516 708.0 L520 712.5 L524 708.0" fill="none" stroke="#6b6b6b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="560" y="682" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b6b6b">BILLED</text>
  <rect x="560" y="690" width="328" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="572" y="714.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a1a1a">Per month</text>
  <path d="M868 708.0 L872 712.5 L876 708.0" fill="none" stroke="#6b6b6b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="72" y="758" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b6b">Enter the amount as charged, in the club’s own currency. An admin adds the</text>
  <text x="72" y="774" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b6b">exchange rate at review, so you do not need to convert anything.</text>
  <line x1="72" y1="798" x2="888" y2="798" stroke="#d8d8d8" stroke-width="1"/>
  <text x="72" y="830" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">Where it posts from</text>
  <text x="72" y="854" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b6b6b">COUNTRY</text>
  <rect x="72" y="862" width="240" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="84" y="886.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1a1a1a">United States</text>
  <path d="M292 880.0 L296 884.5 L300 880.0" fill="none" stroke="#6b6b6b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="336" y="854" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b6b6b">STATE / REGION</text>
  <rect x="336" y="862" width="200" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="348" y="886.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a8a8a8">Ohio</text>
  <text x="560" y="854" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b6b6b">CITY</text>
  <rect x="560" y="862" width="328" height="40" rx="4" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="572" y="886.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a8a8a8">Columbus</text>
  <text x="72" y="930" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="500" fill="#b4530a">Coordinates are geocoded automatically - no lat/lng field.</text>
  <rect x="72" y="952" width="15" height="15" rx="3" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="96" y="964" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1a1a1a">This club posts worldwide</text>
  <line x1="72" y1="996" x2="888" y2="996" stroke="#d8d8d8" stroke-width="1"/>
  <text x="72" y="1026" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b6b6b">CATEGORIES  (pick up to 10)</text>
  <rect x="72" y="1042" width="82.4" height="28" rx="14" fill="#1a1a1a"/>
  <text x="113.2" y="1060" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#ffffff" text-anchor="middle">Postcard</text>
  <rect x="162.4" y="1042" width="75.6" height="28" rx="14" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="200.2" y="1060" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1a1a1a" text-anchor="middle">Pen pal</text>
  <rect x="246.0" y="1042" width="96.0" height="28" rx="14" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="294.0" y="1060" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1a1a1a" text-anchor="middle">Stationery</text>
  <rect x="350.0" y="1042" width="55.2" height="28" rx="14" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="377.6" y="1060" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1a1a1a" text-anchor="middle">Zine</text>
  <rect x="413.2" y="1042" width="82.4" height="28" rx="14" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="454.4" y="1060" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1a1a1a" text-anchor="middle">Mail art</text>
  <rect x="72" y="1076" width="143.6" height="28" rx="14" fill="#1a1a1a"/>
  <text x="143.8" y="1094" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#ffffff" text-anchor="middle">Beginner friendly</text>
  <rect x="223.6" y="1076" width="116.39999999999999" height="28" rx="14" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="281.8" y="1094" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1a1a1a" text-anchor="middle">Kids &amp; family</text>
  <rect x="348.0" y="1076" width="68.8" height="28" rx="14" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="382.4" y="1094" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#1a1a1a" text-anchor="middle">LGBTQ+</text>
  <rect x="40" y="1168" width="200" height="46" rx="5" fill="#1a1a1a"/>
  <text x="140.0" y="1195.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Submit for review</text>
  <rect x="252" y="1168" width="120" height="46" rx="5" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="312.0" y="1195.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">Cancel</text>
  <rect x="952" y="272" width="448" height="260" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="984" y="310" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">What happens next</text>
  <circle cx="998" cy="348" r="12" fill="#ebebea"/>
  <text x="998" y="352.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="1022" y="353" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1a1a">You submit</text>
  <text x="1022" y="372" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b6b">Saved with status &quot;pending&quot;</text>
  <circle cx="998" cy="410" r="12" fill="#ebebea"/>
  <text x="998" y="414.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">2</text>
  <text x="1022" y="415" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1a1a">An admin reviews it</text>
  <text x="1022" y="434" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b6b">Checks the link and the price</text>
  <circle cx="998" cy="472" r="12" fill="#ebebea"/>
  <text x="998" y="476.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">3</text>
  <text x="1022" y="477" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1a1a">It goes live, or not</text>
  <text x="1022" y="496" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b6b">Rejections come with a reason</text>
  <rect x="952" y="556" width="448" height="150" rx="6" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  <text x="984" y="594" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">You must be signed in</text>
  <text x="984" y="620" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b">Anonymous submissions are not</text>
  <text x="984" y="638" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b">accepted - it is the cheapest spam</text>
  <text x="984" y="656" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b">control there is.</text>
  <text x="984" y="684" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="500" fill="#b4530a">POST /api/clubs  -&gt; 401 if signed out</text>
  </g>
</svg>
